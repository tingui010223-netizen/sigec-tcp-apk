name: Compilar APK SIGEC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descomprimir proyecto
        run: |
          mkdir -p android-project
          unzip -q SIGEC_Almacen_Proyecto_Android.zip -d android-project
          find android-project -maxdepth 3 -type f | head -80
          GRADLEW="$(find android-project -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "No se encontró gradlew en el ZIP"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

      - name: Compilar APK
        run: ./gradlew assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: SIGEC-APK-debug
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-foun
          d: error
