name: Compilar APK SIGEC
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Preparar la app
        run: |
          mkdir -p www
          cp menu.html www/index.html
          cp Almacen_Control_Inventario_v7_3_2.html www/almacen.html
          cp cuadre.html www/cuadre.html
          cp sigec.html www/sigec.html
          cp node_modules/jsbarcode/dist/JsBarcode.all.min.js www/
          sed -i 's#https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js#JsBarcode.all.min.js#' www/almacen.html
      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Poner la firma fija y el numero de version
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > android/sigec.jks
          sed -i '0,/^android {/s//android {\n    signingConfigs {\n        debug {\n            storeFile file("..\/sigec.jks")\n            storePassword System.getenv("KS_PASS")\n            keyAlias "sigec"\n            keyPassword System.getenv("KS_PASS")\n        }\n    }/' android/app/build.gradle
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: Aceptar licencias de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Compilar APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publicar APK para descargar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SIGEC-Almacen.apk
          gh release create "v${{ github.run_number }}" SIGEC-Almacen.apk --title "SIGEC Almacén v${{ github.run_number }}" --notes "APK de prueba" --latest